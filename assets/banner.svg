<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#181133"/>
    </linearGradient>

    <radialGradient id="glowPurple" cx="80%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCyan" cx="20%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowAmber" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e0e7ff"/>
      <stop offset="70%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e3a53" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#091e36" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Background Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.25"/>
      <circle cx="40" cy="40" r="1.5" fill="#6366f1" fill-opacity="0.3"/>
    </pattern>

    <!-- Filters -->
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    @keyframes floatSlow1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(-1deg); }
    }
    @keyframes floatSlow2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(7px) rotate(1.2deg); }
    }
    @keyframes floatSlow3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes pulseAura {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.08); }
    }
    @keyframes dashFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes badgeBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .anim-float1 { animation: floatSlow1 6s ease-in-out infinite; }
    .anim-float2 { animation: floatSlow2 7.5s ease-in-out infinite; }
    .anim-float3 { animation: floatSlow3 5.5s ease-in-out infinite; }
    .anim-pulse { animation: pulseAura 8s ease-in-out infinite; transform-origin: center; }
    .anim-dash { stroke-dasharray: 8 6; animation: dashFlow 20s linear infinite; }
    .anim-badge-dot { animation: badgeBlink 2s ease-in-out infinite; }
    
    .font-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .font-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="380" fill="url(#bgGrad)"/>

  <!-- Animated Glowing Auras (Background Layer) -->
  <circle cx="980" cy="80" r="280" fill="url(#glowPurple)" class="anim-pulse"/>
  <circle cx="160" cy="300" r="260" fill="url(#glowCyan)" class="anim-pulse"/>
  <circle cx="600" cy="200" r="220" fill="url(#glowAmber)" class="anim-pulse"/>

  <!-- Tech Matrix Grid Overlay -->
  <rect width="1200" height="380" fill="url(#gridPattern)"/>

  <!-- Subtle Animated Flow Pipelines (Behind Text) -->
  <g opacity="0.35">
    <path d="M 50 190 Q 250 80, 500 190 T 950 190 T 1150 140" fill="none" stroke="#6366f1" stroke-width="1.8" class="anim-dash"/>
    <path d="M 80 250 Q 350 340, 650 240 T 1120 270" fill="none" stroke="#06b6d4" stroke-width="1.5" class="anim-dash" style="animation-direction: reverse;"/>
  </g>

  <!-- Lateral Floating Pill Badges (Positioned cleanly at edges, never over center title) -->
  <!-- Top Left Pill -->
  <g class="anim-float1" transform="translate(60, 45)" filter="url(#pillShadow)">
    <rect width="170" height="36" rx="18" fill="url(#cardGrad1)" stroke="url(#borderGrad)" stroke-width="1.2"/>
    <text x="22" y="23" fill="#a5b4fc" font-size="13" class="font-mono">⚡ Rapid App Dev</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="anim-float2" transform="translate(70, 305)" filter="url(#pillShadow)">
    <rect width="180" height="36" rx="18" fill="url(#cardGrad2)" stroke="#0284c7" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="22" y="23" fill="#38bdf8" font-size="13" class="font-mono">🧩 Drag &amp; Drop UI</text>
  </g>

  <!-- Top Right Pill -->
  <g class="anim-float2" transform="translate(970, 45)" filter="url(#pillShadow)">
    <rect width="170" height="36" rx="18" fill="url(#cardGrad1)" stroke="url(#borderGrad)" stroke-width="1.2"/>
    <text x="22" y="23" fill="#c084fc" font-size="13" class="font-mono">🤖 AI App Builders</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="anim-float1" transform="translate(960, 305)" filter="url(#pillShadow)">
    <rect width="180" height="36" rx="18" fill="url(#cardGrad2)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="22" y="23" fill="#34d399" font-size="13" class="font-mono">🔒 Self-Hosted First</text>
  </g>

  <!-- Lateral Mini Cards for extra tech aesthetics -->
  <g class="anim-float3" transform="translate(45, 125)" opacity="0.85" filter="url(#pillShadow)">
    <rect width="150" height="64" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
    <circle cx="25" cy="25" r="5" fill="#10b981"/>
    <text x="38" y="29" fill="#94a3b8" font-size="11" class="font-mono">REST / GraphQL</text>
    <text x="20" y="48" fill="#e2e8f0" font-size="12" class="font-title">100+ Data Sources</text>
  </g>

  <g class="anim-float3" transform="translate(1005, 135)" opacity="0.85" filter="url(#pillShadow)">
    <rect width="150" height="64" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
    <circle cx="25" cy="25" r="5" fill="#8b5cf6"/>
    <text x="38" y="29" fill="#94a3b8" font-size="11" class="font-mono">Open Core / OSS</text>
    <text x="20" y="48" fill="#e2e8f0" font-size="12" class="font-title">Zero Lock-In</text>
  </g>

  <!-- ================= FOREGROUND HERO CONTENT (Uncompromised Readability) ================= -->

  <!-- Status / Pill Header Tag -->
  <g transform="translate(435, 65)">
    <rect width="330" height="32" rx="16" fill="#1e1b4b" fill-opacity="0.8" stroke="#6366f1" stroke-width="1.2"/>
    <circle cx="20" cy="16" r="4.5" fill="#22c55e" class="anim-badge-dot"/>
    <text x="34" y="21" fill="#c7d2fe" font-size="12" class="font-mono" letter-spacing="1">CURATED DEVELOPER DIRECTORY</text>
  </g>

  <!-- Main Title -->
  <g filter="url(#shadowFilter)">
    <text x="600" y="165" text-anchor="middle" fill="url(#titleGrad)" font-size="44" class="font-title" letter-spacing="-1">
      Awesome No-Code Development
    </text>
    <text x="600" y="215" text-anchor="middle" fill="#f8fafc" font-size="34" class="font-title" letter-spacing="-0.5">
      Platforms &amp; Ecosystem
    </text>
  </g>

  <!-- Subtitle -->
  <text x="600" y="262" text-anchor="middle" fill="#94a3b8" font-size="16" class="font-sub">
    Visual App Builders • Self-Hosted Internal Tools • Low-Code Enterprise Frameworks
  </text>

  <!-- Footer Tagline inside banner -->
  <g transform="translate(460, 290)">
    <rect width="280" height="26" rx="6" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="0.8"/>
    <text x="140" y="17" text-anchor="middle" fill="#64748b" font-size="11.5" class="font-mono">
      ⭐ SaaS Leaders &amp; Open-Source Projects
    </text>
  </g>
</svg>
